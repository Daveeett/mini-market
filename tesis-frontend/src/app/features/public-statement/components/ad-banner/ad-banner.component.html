@if (!hidden()) {
  <!-- CONTENEDOR ADSENSE -->
  <div class="relative w-full rounded-2xl overflow-hidden shadow-xl group my-4 bg-slate-900 border border-slate-800">
    
    <div class="absolute top-2 right-2 z-20 flex items-center gap-1 bg-black/75 backdrop-blur-md px-2 py-0.5 rounded text-[10px] text-slate-300 font-sans border border-slate-700">
      <span>Anuncio</span>
      <button (click)="hideAd($event)" type="button" class="hover:text-red-400 font-bold ml-2">
        ✕
      </button>
    </div>

    <div class="w-full flex items-center justify-center min-h-[100px] bg-slate-900/50 p-2">
      <!-- Google AdSense Tag -->
      <ins class="adsbygoogle"
           style="display:block"
           [attr.data-ad-client]="adClient"
           [attr.data-ad-slot]="type === 'header' ? adSlotHeader : (type === 'native' ? adSlotNative : adSlotFooter)"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
  </div>
}
